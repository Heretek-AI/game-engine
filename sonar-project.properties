# SonarCloud project config: keep quality gates focused on hand-written code.
# Checked-in SPIR-V blobs (*_spv.inc) are MACHINE-GENERATED via
# native/renderer/shaders/embed_spv.py (see shaders/README) — exclude them
# from duplication accounting (they legitimately repeat: two checked-in
# copies per blob, plus hex-word runs that collide across blobs).
sonar.exclusions=**/*_spv.inc,**/*.spv
sonar.cpd.exclusions=**/*_spv.inc,**/*.spv
