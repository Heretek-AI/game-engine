# CodeQL advanced setup: replaces GitHub default setup so vendored
# third-party code (deps/**) is excluded from analysis. Only engine code
# (native/, managed/, tools/) is scanned.
name: codeql

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (C++)
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ninja + Clang
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: c-cpp
          # Third-party code ships its own upstream findings; engine scope only.
          paths-ignore: |
            deps/**/*

      - name: Configure
        run: cmake --preset ci-linux

      - name: Build (traced)
        run: cmake --build --preset ci-linux

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:c-cpp"
