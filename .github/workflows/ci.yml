# M1-01 CI: clean native + managed compilation on all three OSes.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  native:
    name: "native (${{ matrix.os }}, ${{ matrix.compiler }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: clang
            preset: ci-linux
          - os: ubuntu-24.04
            compiler: gcc
            preset: ci-linux-gcc
          - os: macos-15
            compiler: clang
            preset: ci-macos
          - os: windows-2025
            compiler: msvc
            preset: ci-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10 SDK (native hostfxr fixtures)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install Ninja + Clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang cmake libvulkan-dev mesa-vulkan-drivers vulkan-tools glslang-tools libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev libasound2-dev libpulse-dev libdbus-1-dev libudev-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # P7-02: macOS has no preinstalled Vulkan. Install the LunarG macOS
      # SDK (headers + loader + validation + MoltenVK ICD) via the
      # humbletim action (MIT, v1.2, known-good 1.4.309.0). Exports
      # VULKAN_SDK (+ PATH bin) for CMake's FindVulkan and test RPATH.
      - name: Install Vulkan SDK (macOS)
        if: runner.os == 'macOS'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Vulkan device probe (macOS)
        # P7-02: ICD JSON lives at share/vulkan/icd.d/MoltenVK_icd.json
        # (verified in CI log, not assumed). Export the loader search env
        # the SDK documents (VK_ICD_FILENAMES + DYLD_LIBRARY_PATH) so both
        # vulkaninfo and the test binaries find MoltenVK.
        if: runner.os == 'macOS'
        run: |
          ls "$VULKAN_SDK/lib/" | grep -i -E "molten|kosmic|vulkan" || true
          ls "$VULKAN_SDK/share/vulkan/icd.d/"
          export VK_ICD_FILENAMES="$VULKAN_SDK/share/vulkan/icd.d/MoltenVK_icd.json"
          export DYLD_LIBRARY_PATH="$VULKAN_SDK/lib"
          vulkaninfo --summary

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      # P7-01: LunarG Vulkan SDK + Lavapipe software rasterizer on Windows.
      # Decision (P7-00 §4.15.3): Lavapipe keeps golden tolerance behavior
      # closest to the Linux lane (same Mesa CPU driver family). The action
      # registers the Lavapipe ICD automatically; vulkaninfo --summary below
      # proves a device enumerates before the build runs.
      - name: Install Vulkan SDK + Lavapipe (Windows)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1.7.0
        with:
          install_lavapipe: true

      - name: Probe Vulkan device (Windows)
        if: runner.os == 'Windows'
        # Windows SDK binary is vulkaninfoSDK.exe on %VULKAN_SDK%\Bin
        # (vulkaninfo.exe is only the runtime copy). Fall back to the PATH
        # copy in case the action layout changes under us.
        shell: cmd
        run: |
          "%VULKAN_SDK%\Bin\vulkaninfoSDK.exe" --summary || vulkaninfo --summary

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # P7-02: the macOS lane installs the LunarG Vulkan SDK (MoltenVK)
      # above and runs the headless tests against it. $VULKAN_SDK is a
      # SHELL variable exported by the install action (not a GitHub
      # context), so single-quoted '${VULKAN_SDK}/...' inside ${{ }}
      # (a GHA string literal, never shell-expanded) would emit the
      # literal text and volk would find no ICD. Resolve the paths in a
      # shell run step and publish them via $GITHUB_ENV, then reference
      # them here through the env context (expanded by GitHub).
      - name: Export macOS Vulkan env (P7-02)
        if: runner.os == 'macOS'
        run: |
          echo "ENGINE_MACOS_VK_ICD=$VULKAN_SDK/share/vulkan/icd.d/MoltenVK_icd.json" >> "$GITHUB_ENV"
          echo "ENGINE_MACOS_VK_LIB=$VULKAN_SDK/lib" >> "$GITHUB_ENV"

      - name: Test (CTest)
        timeout-minutes: 5
        run: ctest --preset ${{ matrix.preset }} --output-on-failure -V
        env:
          # P7-02: ICD/lib paths published by the Export step above (see
          # note). Empty on Linux/Windows so the stock driver search is
          # untouched there. DYLD_LIBRARY_PATH on macOS reaches the
          # loader through the exported runner env (SIP only strips it
          # for system binaries); run step also appends it as fallback.
          VK_ICD_FILENAMES: ${{ env.ENGINE_MACOS_VK_ICD }}
          DYLD_LIBRARY_PATH: ${{ env.ENGINE_MACOS_VK_LIB }}
          # Linux CI has no display: force the SDL offscreen driver.
          # macOS keeps the real Cocoa driver: hidden windows work
          # headless and surface creation goes through
          # VK_EXT_metal_surface. ENGINE_REQUIRE_GPU stays Linux-only:
          # MoltenVK feature coverage (indirect-count etc.) is verified
          # from the macOS log, not forced fail-closed.
          SDL_VIDEO_DRIVER: ${{ runner.os == 'Linux' && 'offscreen' || '' }}
          # P7-01: Windows lane runs the full GPU suite (Lavapipe ICD).
          # macOS stays unset until P7-02 lands its MoltenVK lane.
          ENGINE_REQUIRE_GPU: ${{ (runner.os == 'Linux' || runner.os == 'Windows') && '1' || '' }}

  managed:
    name: "managed (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Verify formatting (dotnet format)
        run: dotnet format Engine.slnx --verify-no-changes --verbosity diagnostic

      - name: Build Engine.slnx
        run: dotnet build Engine.slnx -c Release --nologo

      - name: Run Engine.Tests gate
        run: dotnet run --project managed/Engine.Tests -c Release --no-build

      - name: Run Engine.EditorApp.Tests gate (P3-01 editor shell)
        run: dotnet run --project managed/Engine.EditorApp.Tests -c Release --no-build -- ${{ runner.temp }}

  supply-chain:
    name: "supply-chain (dependency review)"
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
