# M1-01 CI: clean native + managed compilation on all three OSes.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  native:
    name: "native (${{ matrix.os }}, ${{ matrix.compiler }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: ci-linux
            compiler: clang
          - os: ubuntu-24.04
            preset: ci-linux-gcc
            compiler: gcc
          - os: macos-15
            preset: ci-macos
            compiler: clang
          - os: windows-2025
            preset: ci-windows
            compiler: msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10 SDK (native hostfxr fixtures)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install Ninja + Clang + GCC + SDL3 deps (Linux)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y ninja-build clang cmake gcc g++
          libvulkan-dev mesa-vulkan-drivers vulkan-tools glslang-tools
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev
          libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev
          libasound2-dev libpulse-dev libdbus-1-dev libudev-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test (CTest)
        timeout-minutes: 5
        run: ctest --preset ${{ matrix.preset }} --output-on-failure -V

  managed:
    name: "managed (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Verify formatting (dotnet format)
        run: dotnet format Engine.slnx --verify-no-changes --verbosity diagnostic

      - name: Build Engine.slnx
        run: dotnet build Engine.slnx -c Release --nologo

      - name: Run Engine.Tests gate
        run: dotnet run --project managed/Engine.Tests -c Release --no-build

  supply-chain:
    name: "supply-chain (dependency review)"
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
