# M1-01 CI: clean native + managed compilation on all three OSes.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  native:
    name: "native (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: ci-linux
          - os: macos-15
            preset: ci-macos
          - os: windows-2025
            preset: ci-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja + Clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test (CTest)
        timeout-minutes: 5
        run: ctest --preset ${{ matrix.preset }} --output-on-failure -V

  managed:
    name: "managed (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Verify formatting (dotnet format)
        run: dotnet format Engine.slnx --verify-no-changes --verbosity diagnostic

      - name: Build Engine.slnx
        run: dotnet build Engine.slnx -c Release --nologo

      - name: Run Engine.Tests gate
        run: dotnet run --project managed/Engine.Tests -c Release --no-build

  supply-chain:
    name: "supply-chain (dependency review)"
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
